apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: linuxtips
spec:
  instanceProfile: "prd-us-east-2-ct-arch-eksnodes-instanceprofile"
  amiFamily: "AL2023"
  amiSelectorTerms:
  - id: ami-043409a6cbf28bcb3
  securityGroupSelectorTerms:
  - id: sg-0f92873afee87aee8
  subnetSelectorTerms:
  - id: subnet-0d15e2469ec95e4fa
  - id: subnet-004ee8ffae71d7137
  - id: subnet-002e0e4c3ab6fab9d
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: linuxtips
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
  template:
    metadata:
      labels:
        workload: "etc"
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
          - c7i-flex
          - m7i-flex

        - key: karpenter.sh/capacity-type
          operator: In
          values:
          - "spot"

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
          - large

        - key: "topology.kubernetes.io/zone"
          operator: In
          values:
          - "us-east-2a"
          - "us-east-2b"
          - "us-east-2c"

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: linuxtips
